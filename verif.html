<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contenedor principal (la tarjeta blanca) */
        .tarjeta {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px 25px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
        }

        /* --- PANTALLA 1: SELECCIÓN --- */
        #pantallaSeleccion {
            display: block;
        }

        h2 {
            font-size: 20px;
            color: #202124;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .subtitulo {
            font-size: 14px;
            color: #5f6368;
            margin: 0 0 20px 0;
        }

        .instruccion {
            font-size: 15px;
            color: #202124;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Cuadrícula de imágenes */
        .cuadricula {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cuadricula img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            box-sizing: border-box;
            background-color: #eee;
        }

        .cuadricula img:hover {
            opacity: 0.8;
        }

        /* Estilo de imagen seleccionada */
        .cuadricula img.seleccionada {
            border-color: #1a73e8; /* Azul */
            transform: scale(0.95);
            opacity: 0.6;
        }

        /* Barra inferior de iconos y botón confirmar */
        .barra-herramientas {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .iconos {
            display: flex;
            gap: 15px;
            color: #5f6368;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-confirmar {
            background-color: #f9ab00;
            color: #202124;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-confirmar:hover {
            background-color: #e09b00;
        }

        /* Botones inferiores (Regresar / Continuar) */
        .botones-navegacion {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-regresar {
            background-color: #1a2b4c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-continuar {
            background-color: #e0e0e0;
            color: #9e9e9e;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            cursor: not-allowed;
            letter-spacing: 1px;
        }

        /* --- PANTALLA 2: ÉXITO (idéntica a tu foto 2) --- */
        #pantallaExito {
            display: none; /* Oculto por defecto */
        }

        .titulo-exito {
            font-size: 32px;
            color: #202124;
            margin: 10px 0 20px 0;
            font-weight: 400;
        }

        .caja-verde {
            background-color: #f0f9f0; /* Fondo verde muy claro */
            border-radius: 8px;
            padding: 40px 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .icono-check {
            width: 60px;
            height: 60px;
            border: 4px solid #34a853; /* Verde Google */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #34a853;
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .texto-completado {
            color: #34a853;
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            line-height: 1.4;
        }

        .texto-redirigir {
            color: #5f6368;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        
        <!-- ================= PANTALLA 1: SELECCIÓN ================= -->
        <div id="pantallaSeleccion">
            <h2>Verificación de seguridad</h2>
            <p class="subtitulo">Confirma que eres humano para continuar.</p>
            <p class="instruccion">Elige todas <u>las cortinas</u>.</p>
            
            <div class="cuadricula" id="gridImagenes">
                <!-- Fila 1 -->
                <img src="https://picsum.photos/id/1/100/100" alt="1">
                <img src="https://picsum.photos/id/2/100/100" alt="2">
                <img src="https://picsum.photos/id/3/100/100" alt="3">
                <!-- Fila 2 -->
                <img src="https://picsum.photos/id/4/100/100" alt="4">
                <img src="https://picsum.photos/id/5/100/100" alt="5">
                <img src="https://picsum.photos/id/6/100/100" alt="6">
                <!-- Fila 3 -->
                <img src="https://picsum.photos/id/7/100/100" alt="7">
                <img src="https://picsum.photos/id/8/100/100" alt="8">
                <img src="https://picsum.photos/id/9/100/100" alt="9">
            </div>

            <div class="barra-herramientas">
                <div class="iconos">
                    <span>⟳</span>
                    <span>ⓘ</span>
                    <span>🎧</span>
                </div>
                <button class="btn-confirmar" id="btnConfirmar">Confirmar</button>
            </div>

            <div class="botones-navegacion">
                <button class="btn-regresar">REGRESAR</button>
                <button class="btn-continuar" disabled>CONTINUAR</button>
            </div>
        </div>

        <!-- ================= PANTALLA 2: ÉXITO ================= -->
        <div id="pantallaExito">
            <h2>Verificación de seguridad</h2>
            <p class="subtitulo">Confirma que eres humano para continuar.</p>
            
            <div class="titulo-exito">Correcto</div>

            <div class="caja-verde">
                <div class="icono-check">✓</div>
                <p class="texto-completado">¡Completado<br>correctamente!</p>
            </div>

            <p class="texto-redirigir">Se le redirigirá en breve.</p>
            
            <div class="botones-navegacion" style="margin-top: 25px;">
                <button class="btn-regresar">REGRESAR</button>
                <button class="btn-continuar" style="background-color: #e0e0e0; color: #9e9e9e; cursor: default;">CONTINUAR</button>
            </div>
        </div>

    </div>

    <script>
        // 1. Seleccionar elementos
        const imagenes = document.querySelectorAll('#gridImagenes img');
        const btnConfirmar = document.getElementById('btnConfirmar');
        const pantallaSeleccion = document.getElementById('pantallaSeleccion');
        const pantallaExito = document.getElementById('pantallaExito');

        // 2. Lógica para seleccionar/deseleccionar imágenes
        imagenes.forEach(img => {
            img.addEventListener('click', () => {
                img.classList.toggle('seleccionada');
            });
        });

        // 3. Lógica del botón "Confirmar"
        btnConfirmar.addEventListener('click', () => {
            // Contamos cuántas imágenes están seleccionadas
            const seleccionadas = document.querySelectorAll('#gridImagenes img.seleccionada');
            const cantidad = seleccionadas.length;

            // CONDICIÓN: Si selecciona exactamente 5 imágenes, es correcto.
            if (cantidad === 5) {
                // Éxito: Ocultamos la pantalla 1 y mostramos la pantalla 2
                pantallaSeleccion.style.display = 'none';
                pantallaExito.style.display = 'block';
                
                // Opcional: Redirigir después de 3 segundos
                // setTimeout(() => { window.location.href = "https://google.com"; }, 3000);
            } else {
                // Error: Si no son 5, mostramos alerta y limpiamos
                alert("Verificación fallida. Debes seleccionar exactamente 5 imágenes (las cortinas).");
                // Desmarcamos todas para que lo intente de nuevo
                imagenes.forEach(img => img.classList.remove('seleccionada'));
            }
        });

        // 4. Lógica del botón "Regresar" (solo recarga la página para empezar de nuevo)
        document.querySelectorAll('.btn-regresar').forEach(btn => {
            btn.addEventListener('click', () => {
                location.reload();
            });
        });

    </script>

</body>
</html>
